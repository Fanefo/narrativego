<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      .brand-narrative-light {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 32px;
        fill: #FFFFFF;
        letter-spacing: 0.04em;
      }
      .brand-go-text-light {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #FFFFFF;
        letter-spacing: 0.02em;
      }
    </style>
  </defs>

  <!-- Wordmark 'NARRATIVE' -->
  <text x="4" y="44" class="brand-narrative-light">NARRATIVE</text>

  <!-- Emblem 'GO' in Orange Circle -->
  <g transform="translate(242, 6)">
    <circle cx="26" cy="26" r="26" fill="#F79F48"/>
    <!-- Horizontal notch lines cutting the perimeter -->
    <rect x="-3" y="24" width="8" height="4" fill="#015147" rx="1"/>
    <rect x="47" y="24" width="8" height="4" fill="#015147" rx="1"/>
    <!-- GO text inside -->
    <text x="26" y="33" class="brand-go-text-light" text-anchor="middle">GO</text>
  </g>
</svg>