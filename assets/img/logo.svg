<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 48" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-title {
        font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-weight: 600;
        font-size: 26px;
        fill: #015147;
        letter-spacing: -0.01em;
      }
      .brand-go {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 11.5px;
        fill: #015147;
        letter-spacing: 0.04em;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 8.5px;
        fill: #45615D;
        letter-spacing: 0.13em;
      }
    </style>
  </defs>

  <!-- Circular Growth Emblem -->
  <circle cx="24" cy="24" r="22" fill="#015147"/>
  <path d="M14 34V14L26 30V14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 22L35 15M35 15H29M35 15V21" stroke="#F79F48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark 'narrative' with generous clearance -->
  <text x="56" y="27" class="brand-title">narrative</text>

  <!-- Orange Pill for 'GO' moved clearly to the right so 'e' and 'v' have plenty of space -->
  <rect x="195" y="9" width="38" height="23" rx="11.5" fill="#F79F48"/>
  <text x="214" y="25" class="brand-go" text-anchor="middle">GO</text>

  <!-- Sub-label aligned with title -->
  <text x="57" y="40" class="brand-sub">BY KRISZTINA HEGEDŰS • SEO STRATEGY</text>
</svg>
